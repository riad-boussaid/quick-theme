name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $value = $env:GITHUB_REF.Substring(11)
          } else {
            $match = Select-String -Path quick-theme.csproj -Pattern '<Version>([^<]+)</Version>'
            $value = $match.Matches[0].Groups[1].Value.Trim()
          }
          "value=$value" >> $env:GITHUB_OUTPUT

      - name: Publish packages
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.value }}"
          $repo = "${{ github.repository }}"
          $feed = "https://github.com/$repo/releases/latest/download/update.json"
          $download = "https://github.com/$repo/releases/latest/download/quick-theme.exe"
          ./publish.ps1 -Version $version -FeedUrl $feed -UpdateUrl $download

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quick-theme-${{ steps.version.outputs.value }}
          path: |
            artifacts/quick-theme.exe
            artifacts/update.json
            artifacts/quick-theme-*-win-x64.zip
            artifacts/quick-theme-*-setup.exe

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/quick-theme.exe
            artifacts/update.json
            artifacts/quick-theme-*-win-x64.zip
            artifacts/quick-theme-*-setup.exe
